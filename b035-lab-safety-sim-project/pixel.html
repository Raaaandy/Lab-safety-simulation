*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:"Pixelify Sans",ui-rounded,system-ui,sans-serif;font-size:17px;line-height:1.4}

.bar{display:flex;gap:.5rem 1rem;flex-wrap:wrap;align-items:center;padding:.6rem 1rem}
button{font:inherit;font-weight:600;border:3px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:.3rem .8rem;cursor:pointer;min-height:44px}
button:hover{background:var(--line);color:var(--paper)}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
label{display:flex;gap:.4rem;align-items:center}
input[type=checkbox]{width:1.1rem;height:1.1rem;accent-color:var(--accent)}
.keys{color:var(--muted);font-size:.95rem}
kbd{font-family:inherit;border:2px solid var(--line);border-radius:4px;padding:0 .3rem}
details{margin:0 1rem 1rem;background:var(--surface);border:2px solid color-mix(in srgb,var(--line) 40%,transparent);border-radius:6px;padding:.4rem .8rem}
summary{cursor:pointer;font-weight:600}
#log{list-style:none;margin:.4rem 0 0;padding:0;max-height:220px;overflow:auto}
#log li{padding:.25rem 0;border-top:1px solid color-mix(in srgb,var(--line) 25%,transparent)}
#log li.bad{color:#C8102E}
#log li.good{color:var(--accent)}
@media (max-width:700px){ #game{height:62vh;margin:0 .5rem} .keys{display:none} }
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
</style>

const UTILS = [[502,266],[686,268],[313,512],[526,512],[680,510],[83,510],[89,822],[515,818]];
const TROUGH = {x:428,y:46,w:20,h:1052};
const SPILL = {x:290,y:478,r:24};
const ASSEMBLY = {x:800,y:600};
const TREES = [[-35,180],[-38,420],[-30,980],[800,250],[805,880],[790,1130],[180,1150],[470,1155],[300,-35],[690,-40]];
const START = {x:625,y:72};

const STEPS = [
  {id:'ppe',   text:'Put on your PPE at the cubbies by the entrance.', target:['cubbyA','cubbyB']},
  {id:'get',   text:'Collect the acetone bottle from the flammables cabinet.', target:['flam']},
  {id:'hood',  text:'Dispense the acetone inside the fume hood.', target:['hood']},
  {id:'return',text:'Return the bottle to the flammables cabinet.', target:['flam']},
  {id:'kit',   text:'Spill by the benches! Fetch the spill kit from the blue cabinet.', target:['blue'], urgent:true},
  {id:'clean', text:'Clean up the spill. Don’t walk through it.', target:['spill'], urgent:true},
  {id:'eyewash',text:'A drop splashed into your eye. Get to the eyewash station below the centrifugal pump!', target:['eyewash'], urgent:true, timer:10},
  {id:'evac',  text:'Fire alarm! Leave the building and walk to the assembly point outside.', target:['assembly'], urgent:true, timer:35},
];
const FONT = '"Pixelify Sans", ui-rounded, sans-serif';

// ================= Page helpers =================
const $ = id => document.getElementById(id);
let speak=true, sound=true, lastSpoken='', heardGesture=false;
$('optSpeak').onchange=e=>speak=e.target.checked;
$('optSound').onchange=e=>sound=e.target.checked;
// Screen-reader channel: a hidden live region outside the collapsible log, so it is announced even when the log is closed.
function announce(msg){
  const sr=$('sr'), p=document.createElement('p'); p.textContent=msg; sr.appendChild(p);
  while(sr.children.length>6) sr.removeChild(sr.firstChild);
}
// Read-aloud channel: queue utterances instead of cancelling, so quick successive messages are all heard.
function speakText(msg){
  lastSpoken=msg;
  if(!speak||!('speechSynthesis' in window)) return;
  const u=new SpeechSynthesisUtterance(msg); u.lang='en-US'; u.rate=1.05;
  speechSynthesis.speak(u);
}
// Browsers block speech until the first key press or tap, so repeat the last message once that happens.
function firstGesture(){ if(heardGesture) return; heardGesture=true; if(speak&&lastSpoken&&'speechSynthesis' in window&&!speechSynthesis.speaking) speakText(lastSpoken); }
window.addEventListener('keydown',firstGesture); window.addEventListener('pointerdown',firstGesture);
function domLog(msg,cls){
  const li=document.createElement('li'); li.textContent=msg; if(cls) li.className=cls; $('log').prepend(li);
  announce(msg); speakText(msg);
}
let actx;
function beep(freq=880,dur=.15,times=1,type='square'){
  if(!sound) return;
  try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    for(let i=0;i<times;i++){ const o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime+i*dur*1.8;
      o.type=type; o.frequency.value=freq; g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t+dur); } }catch(e){}
}
const distToRect=(px,py,o)=>Math.hypot(Math.max(o.x-px,0,px-(o.x+o.w)),Math.max(o.y-py,0,py-(o.y+o.h)));
const compass=(dx,dy)=>['north','north-east','east','south-east','south','south-west','west','north-west'][Math.round(((Math.atan2(dx,-dy)*180/Math.PI+360)%360)/45)%8];
function rng(seed){ let a=0; for(const ch of String(seed)) a=(a*31+ch.charCodeAt(0))|0; return ()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}; }
function shade(hex,amt){ const n=parseInt(hex.slice(1),16); const f=v=>Math.max(0,Math.min(255,Math.round(amt<0?v*(1+amt):v+(255-v)*amt)));
  return '#'+((1<<24)|(f(n>>16)<<16)|(f(n>>8&255)<<8)|f(n&255)).toString(16).slice(1); }

// ================= Pixel-art painters =================
const R=(c,col,x,y,w=1,h=1)=>{c.fillStyle=col;c.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));};
const O=(c,col,x,y,w,h)=>{R(c,'#2B1E16',x,y,w,h);R(c,col,x+1,y+1,w-2,h-2);};
function tex(scene,key,w,h,draw){ if(scene.textures.exists(key)) return; const t=scene.textures.createCanvas(key,w,h); const c=t.getContext(); draw(c,w,h); t.refresh(); }
function block(c,w,h,top,face){
  const fh=Math.max(4,Math.min(12,Math.round(h*.18)));
  R(c,'#2B1E16',0,0,w,h); R(c,top,1,1,w-2,h-fh-1); R(c,shade(top,.3),1,1,w-2,1); R(c,shade(top,.15),1,1,1,h-fh-1);
  R(c,face,1,h-fh,w-2,fh-1); R(c,shade(face,-.3),1,h-2,w-2,1); R(c,shade(top,-.35),1,h-fh-1,w-2,1);
  return fh;
}
function gauge(c,x,y){ R(c,'#2B1E16',x,y,6,6); R(c,'#F4F1E8',x+1,y+1,4,4); R(c,'#C8102E',x+3,y+2,1,2); }
function beaker(c,x,y,r){ const col=['#7EC8E3','#F29BB2','#B5E27A','#F6D06B'][Math.floor(r()*4)];
  R(c,'#2B1E16',x,y,5,7); R(c,'#E4F4FA',x+1,y+1,3,5); R(c,col,x+1,y+3,3,3); R(c,'#FFFFFF',x+1,y+1,1,2); }
function drawFurniture(c,w,h,o){
  const r=rng(o.id);
  switch(o.kind){
    case 'bench': case 'table': {
      const wood=o.kind==='table'?'#D9A066':'#C98B4F', fh=block(c,w,h,wood,shade(wood,-.35));
      for(let y=7;y<h-fh-2;y+=7) R(c,shade(wood,-.12),2,y,w-4,1);
      if(o.kind==='bench'){ const n=2+Math.floor(r()*3); for(let i=0;i<n;i++) beaker(c,3+r()*(w-10),3+r()*(h-fh-12),r); }
      else { R(c,'#2B1E16',w/2-6,h/2-6,12,9); R(c,'#FFFFFF',w/2-5,h/2-5,10,7); R(c,'#B8C2CC',w/2-4,h/2-3,8,1); R(c,'#B8C2CC',w/2-4,h/2-1,6,1); }
      break; }
    case 'hood': { const fh=block(c,w,h,'#C5CCD3','#9AA4AE');
      for(let x=4;x<w-4;x+=3) R(c,'#6C7782',x,3,1,4);
      R(c,'#2B1E16',3,9,w-6,h-fh-12); R(c,'#8FCDE4',4,10,w-8,h-fh-14);
      for(let i=0;i<w-12;i+=26){ for(let k=0;k<8;k++) R(c,'#D7F0F8',8+i+k,11+k,2,1); }
      R(c,'#6C7782',4,(h-fh)/2+3,w-8,2);
      for(let y=h-fh;y<h-1;y++) for(let x=1;x<w-1;x++) if(((x+y)>>2)%2) R(c,'#F2C200',x,y); else R(c,'#2A2A2A',x,y);
      break; }
    case 'flam': { const fh=block(c,w,h,'#E8B82A','#B88A14');
      R(c,'#8A6510',w/2,2,1,h-fh-3); R(c,'#2B1E16',w/2-2,(h-fh)/2-1,1,4); R(c,'#2B1E16',w/2+2,(h-fh)/2-1,1,4);
      const lx=w/2-6, ly=8; R(c,'#2B1E16',lx,ly,12,12); R(c,'#C8102E',lx+1,ly+1,10,10);
      R(c,'#F6A623',lx+4,ly+3,4,6); R(c,'#FFE08A',lx+5,ly+5,2,3); break; }
    case 'cold': { const fh=block(c,w,h,'#EDF1F4','#C4CCD3');
      R(c,'#2B1E16',6,6,w-12,8); R(c,'#3A7BD5',7,7,w-14,6); R(c,'#BFE3FF',8,8,6,2); R(c,'#8E99A3',w-7,18,2,h-fh-26); break; }
    case 'wash': { const fh=block(c,w,h,'#B7C1C9','#8E99A3');
      if(h>40){ R(c,'#2B1E16',6,16,w-12,h-fh-30); R(c,'#7D8892',7,17,w-14,h-fh-32); R(c,'#7EC8E3',9,20,w-18,h-fh-38);
        R(c,'#2B1E16',w/2-6,3,12,11); R(c,'#00855A',w/2-5,4,10,9); R(c,'#FFFFFF',w/2-1,5,2,7); R(c,'#FFFFFF',w/2-4,8,8,2); }
      else { R(c,'#7EC8E3',5,5,w-10,h-fh-9); R(c,'#FFFFFF',6,6,2,2); }
      break; }
    case 'cab': { const fh=block(c,w,h,'#3E6FB5','#2C528A');
      R(c,'#2C528A',w/2,2,1,h-fh-3); R(c,'#F4F1E8',w/2-4,(h-fh)/2-1,2,3); R(c,'#F4F1E8',w/2+3,(h-fh)/2-1,2,3);
      R(c,'#2B1E16',6,4,18,9); R(c,'#FFFFFF',7,5,16,7); R(c,'#00855A',9,7,12,3); break; }
    case 'hot': { const fh=block(c,w,h,'#646C75','#454B52');
      for(let x=6;x<w-6;x+=8) R(c,'#2E3238',x,5,4,h-fh-10);
      for(let x=1;x<w-1;x++) R(c,((x>>2)%2)?'#E2552D':'#F2C200',x,h-fh,1,2);
      R(c,'#2B1E16',w-16,6,11,10); R(c,'#F2C200',w-15,7,9,8); R(c,'#2B1E16',w-11,8,1,4); R(c,'#2B1E16',w-11,13,1,1); break; }
    case 'cubby': { const fh=block(c,w,h,'#B67B45','#8A5631');
      const cols=Math.max(1,Math.floor((w-2)/10)), rows=Math.max(1,Math.floor((h-fh-2)/10));
      for(let i=0;i<cols;i++) for(let j=0;j<rows;j++){ const x=2+i*10,y=2+j*10; R(c,'#5B3A1E',x,y,8,8);
        if(r()<.7) R(c,['#D94F4F','#4F7FD6','#3F9E5A','#E8B82A','#9B59B6'][Math.floor(r()*5)],x+1,y+2,6,6); }
      break; }
    case 'shelf': { const fh=block(c,w,h,'#A3A9B0',shade('#A3A9B0',-.3));
      for(let x=4;x<w-6;x+=9) if(r()<.75) beaker(c,x,2,r); break; }
    case 'col': { block(c,w,h,'#C9C2B4','#9E968A'); R(c,'#B3AB9C',3,3,w-6,1); break; }
    default: { const paint=['#7FA7C9','#8BB37A','#D49A5A','#A3A9B0','#C98FB8'][Math.floor(r()*5)];
      const fh=block(c,w,h,paint,shade(paint,-.35));
      if(w>14&&h>14){ R(c,shade(paint,-.15),4,4,w-8,h-fh-8);
        const n=Math.max(1,Math.floor(Math.max(w,h)/28)); for(let i=0;i<n;i++){ if(w>=h) gauge(c,6+i*(w-14)/Math.max(1,n-1||1),6); else gauge(c,(w-6)/2,6+i*(h-fh-16)/Math.max(1,n-1||1)); }
        if(w>=h) R(c,'#5E6670',4,h-fh-6,w-8,2); else R(c,'#5E6670',w-6,4,2,h-fh-8); }
    }

}
function drawPerson(c,ox,oy,dir,f,ppe){
  const P=(col,x,y,w,h)=>R(c,col,ox+x,oy+y,w,h), Q=(col,x,y,w,h)=>O(c,col,ox+x,oy+y,w,h);
  const skin='#F2C49B',hair='#6B3E26',top=ppe?'#F4F6F8':'#4E8F5A',topS=ppe?'#C9D2DA':'#3B7046',pants='#3B4A7A',shoe='#3A2A20',hand=ppe?'#4F7FD6':skin;
  const s=f===0?0:(f===1?1:-1);
  c.globalAlpha=.28; P('#000',4,27,12,3); c.globalAlpha=1;
  // legs
  const lx=dir==='l'?6+s:5, rx=dir==='l'?9-s:10;
  Q(pants,lx,20,5,9-(s>0?1:0)); Q(pants,rx,20,5,9-(s<0?1:0));
  P(shoe,lx+1,26-(s>0?1:0),3,2); P(shoe,rx+1,26-(s<0?1:0),3,2);
  // arms (behind torso for side view)
  if(dir!=='l'){ Q(top,1,13+s,4,8); P(hand,2,19+s,2,2); Q(top,15,13-s,4,8); P(hand,16,19-s,2,2); }
  // torso
  Q(top,4,12,12,ppe?13:10); P(topS,5,13,10,1);
  if(ppe){ if(dir!=='u'){ P(topS,9,14,1,10); P('#2B1E16',7,16,1,1); P('#2B1E16',7,19,1,1);} }
  else P('#2E2E2E',5,20,10,1);
  if(dir==='l'){ Q(top,8,13+s,4,8); P(hand,9,19+s,2,2); }
  // head
  Q(skin,4,1,12,11);
  if(dir==='u'){ P(hair,5,2,10,9); if(ppe){P('#2E3944',5,7,10,1);} }
  else if(dir==='l'){ P(hair,5,2,10,3); P(hair,10,5,5,6); P('#2B1E16',6,7,1,2); P('#D9987A',8,9,1,1);
    if(ppe){ P('#2E3944',9,7,6,1); P('#2E3944',4,6,5,4); P('#8FD3F0',5,7,3,2); } }
  else { P(hair,5,2,10,3); P(hair,5,5,1,3); P(hair,14,5,1,3); P('#2B1E16',7,7,1,2); P('#2B1E16',12,7,1,2); P('#C27E5E',9,10,2,1);
    if(ppe){ P('#2E3944',5,6,10,4); P('#8FD3F0',6,7,3,2); P('#8FD3F0',11,7,3,2); } }
}

  setZoom(z){ const w=this.scale.width,h=this.scale.height;
    this.zoomPick=z||Math.max(2,Math.min(4,Math.floor(Math.min(w/300,h/220))));
    this.cameras.main.setZoom(this.zoomPick); }
  toggleMap(){ this.mini.setVisible(!this.mini.visible); }

  say(text,kind){ this.lastMsg={text,kind,id:Math.random()}; domLog(text,kind==='alert'?'bad':kind); }
  get step(){ return STEPS[this.s.step]; }
  feet(){ return this.player.body.center; }

  enterStep(){
    if(this.s.pendingFirst===false && this.s.entered===this.s.step) return;
    this.s.pendingFirst=false; this.s.entered=this.s.step;
    const st=this.step; if(!st) return this.finish();
    if(st.id==='kit'){ this.s.spill=true; this.spill.setVisible(true); beep(660,.12,2); this.cameras.main.shake(200,.003); }
    if(st.id==='eyewash') beep(520,.2,2);
    if(st.id==='evac'){ this.alarm=this.time.addEvent({delay:900,loop:true,callback:()=>beep(990,.3,1,'sawtooth')}); }
    this.s.timer=st.timer||null; this.s.timerFailed=false; this.s.warned=false;
    this.say(st.text, st.urgent?'alert':null);
  }
  advance(msg){
    if(msg) this.say(msg,'good'); beep(1320,.08,2,'triangle');
    if(this.step&&this.step.id==='evac'&&this.alarm) this.alarm.remove();
    this.s.step++; this.enterStep();
  }
  violate(key,msg){
    if(this.s.flags[key]) return; this.s.flags[key]=true;
    this.s.score=Math.max(0,this.s.score-10); this.s.violations.push(msg);
    this.say('Violation: '+msg,'bad'); beep(200,.3); this.cameras.main.shake(180,.004);
  }
  nearObj(ids,d=20){ const f=this.feet(); return OBJ.find(o=>ids.includes(o.id)&&distToRect(f.x,f.y,o)<=d); }
  nearest(d=20){ const f=this.feet(); let best=null,bd=d; OBJ.forEach(o=>{ const k=distToRect(f.x,f.y,o); if(k<=bd){bd=k;best=o;} }); return best; }
  nearSpill(){ const f=this.feet(); return Math.hypot(f.x-SPILL.x,f.y-SPILL.y)<SPILL.r+26; }
  canAct(){ const st=this.step; if(!st||this.s.done) return false;
    if(st.id==='clean') return this.nearSpill(); if(st.id==='evac') return false; return !!this.nearObj(st.target); }

  act(){
    if(this.s.done) return;
    if(this.s.pendingFirst){ this.enterStep(); return; }
    const st=this.step;
    if(st.id==='ppe'&&this.nearObj(['cubbyA','cubbyB'])){ this.s.ppe=true; return this.advance('Bag stashed. Goggles, lab coat and nitrile gloves on. Looking sharp!'); }
    if(st.id==='get'&&this.nearObj(['flam'])){ this.s.carry=true; return this.advance('Got the acetone. Carry it carefully, with both hands.'); }
    if(st.id==='hood'){
      if(this.nearObj(['hood'])) return this.advance('Dispensed inside the hood with the sash lowered. Nice.');
      if(this.nearObj(OBJ.filter(o=>o.kind==='bench').map(o=>o.id))) return this.violate('bench','Tried to dispense acetone on an open bench. Volatile solvents go in the fume hood.');
    }
    if(st.id==='return'&&this.nearObj(['flam'])){ this.s.carry=false; return this.advance('Bottle back in the cabinet, doors closed.'); }
    if(st.id==='kit'&&this.nearObj(['blue'])){ this.s.kit=true; return this.advance('Spill kit in hand: absorbent pads, scoop and a waste bag.'); }
    if(st.id==='clean'&&this.nearSpill()){ this.s.spill=false; this.s.kit=false; this.spill.setVisible(false);
      return this.advance('Absorbed from the edges inward and bagged as hazardous waste.'); }
    if(st.id==='eyewash'&&this.nearObj(['eyewash'])) return this.advance('Eyewash running. In a real splash, flush for 15 minutes and report it.');
    const o=this.nearest(); if(o) this.say(o.label+': '+o.note);
  }
  describe(){
    const f=this.feet();
    const list=OBJ.map(o=>({o,d:distToRect(f.x,f.y,o)})).sort((a,b)=>a.d-b.d).slice(0,3)
      .map(({o,d})=>`${o.label}, ${(d*M_PER_PX).toFixed(1)} m ${compass(o.x+o.w/2-f.x,o.y+o.h/2-f.y)}`);
    const t=this.targetPoint(); let extra='';
    if(t){ extra=` Your target is about ${(Math.hypot(t.x-f.x,t.y-f.y)*M_PER_PX).toFixed(1)} m ${compass(t.x-f.x,t.y-f.y)}.`; }
    this.say('Nearest: '+list.join('; ')+'.'+extra);
  }
  targetPoint(){
    const st=this.step; if(!st||this.s.done) return null; const f=this.feet();
    if(st.target[0]==='spill') return {x:SPILL.x,y:SPILL.y-18};
    if(st.target[0]==='assembly') return {x:ASSEMBLY.x,y:ASSEMBLY.y-40};
    const o=OBJ.filter(o=>st.target.includes(o.id)).sort((a,b)=>distToRect(f.x,f.y,a)-distToRect(f.x,f.y,b))[0];
    return {x:o.x+o.w/2,y:o.y-4};
  }
  finish(){
    this.s.done=true; this.player.setVelocity(0); this.player.anims.stop();
    const secs=Math.round((this.time.now-this.s.t0)/1000), v=this.s.violations;
    this.result={secs,score:this.s.score,v};
    this.say(`Drill complete in ${secs} s. Score ${this.s.score}/100. ${v.length?v.length+' violation(s): '+v.join(' '):'No violations. Perfect run!'}`, v.length?null:'good');
    beep(784,.12,4,'triangle');
  }

  update(time,delta){
    const p=this.player, k=this.keys, dt=delta/1000, f=this.feet();
    this.miniDot.setPosition(f.x,f.y);
    const t=this.targetPoint();
    this.marker.setVisible(!!t); this.miniTgt.setVisible(!!t);
    if(t){ this.marker.setPosition(t.x,t.y-6+Math.round(Math.sin(time/180)*3)); this.miniTgt.setPosition(t.x,t.y+20); }
    if(this.s.done) return;

    let vx=(k.LEFT.isDown||k.A.isDown?-1:0)+(k.RIGHT.isDown||k.D.isDown?1:0);
    let vy=(k.UP.isDown||k.W.isDown?-1:0)+(k.DOWN.isDown||k.S.isDown?1:0);
    if(!vx&&!vy&&this.ptr&&this.ptr.isDown){ const w=this.ptr.positionToCamera(this.cameras.main); const dx=w.x-f.x, dy=w.y-f.y; if(Math.hypot(dx,dy)>6){vx=dx;vy=dy;} }
    const len=Math.hypot(vx,vy), running=k.SHIFT.isDown&&len>0, sp=running?150:85;
    const v=this.s.ppe?'ppe':'civ';
    if(len){ p.setVelocity(vx/len*sp,vy/len*sp);
      const d=Math.abs(vx)>Math.abs(vy)?(vx<0?'l':'r'):(vy<0?'u':'d'); this.s.dir=d;
      p.setFlipX(d==='r'); p.anims.play(v+'-'+(d==='r'?'l':d),true); p.anims.timeScale=running?1.7:1; }
    else { p.setVelocity(0); p.anims.stop(); const d=this.s.dir; p.setFlipX(d==='r'); p.setTexture('p_'+v,(d==='r'?'l':d)+'0'); }
    p.setDepth(100+f.y+3);
    const carrying=this.s.carry||this.s.kit;
    this.held.setVisible(carrying).setTexture(this.s.carry?'bottle':'kit').setPosition(p.x+(this.s.dir==='l'?-7:7),p.y+5).setDepth(p.depth+1);
    if(this.s.dir==='u') this.held.setDepth(p.depth-1);

    // Mirror canvas-only cues (name tag, E prompt) to the screen reader and read-aloud channels when they change.
    const nb=this.nearest(20), can=this.canAct();
    const tObj=can&&this.step&&this.step.id!=='clean'?this.nearObj(this.step.target):null;
    const m=can?(tObj?tObj.label:'Spill')+'. Press E.':(nb?nb.label:'');
    if(m!==this.s.nearMsg){ this.s.nearMsg=m; if(m){ announce(m); speakText(m); } }

    if(this.s.pendingFirst) return;
    this.s.runT=running?this.s.runT+dt:0;
    if(this.s.runT>.8) this.violate(this.step.id==='evac'?'runEvac':'run', this.step.id==='evac'?'Ran during the evacuation. Walk quickly, don’t run.':'Ran inside the lab. Walking keeps spills and collisions from happening.');
    if(!this.s.ppe&&Math.hypot(f.x-START.x,f.y-START.y)>150) this.violate('ppe','Entered the work area without PPE.');
    if(this.s.carry&&this.nearObj(['steam','hx'],50)) this.violate('ignite','Carried acetone next to the steam bench / heat exchanger, an ignition source.');
    if(this.s.spill&&Math.hypot(f.x-SPILL.x,f.y-SPILL.y)<SPILL.r) this.violate('spill','Walked through the spill and tracked it across the floor.');

    if(this.s.timer!==null){ this.s.timer-=dt;
      if(!this.s.warned&&this.s.timer<=5&&this.s.timer>0){ this.s.warned=true; announce('5 seconds left.'); speakText('5 seconds left.'); }
      if(this.s.timer<=0&&!this.s.timerFailed){ this.s.timerFailed=true;
        this.violate('timer-'+this.step.id, this.step.id==='evac'?'Too slow reaching the assembly point.':'Took more than 10 s to reach the eyewash.'); } }
    if(this.step.id==='evac'&&Math.hypot(f.x-ASSEMBLY.x,f.y-ASSEMBLY.y)<40) this.advance('Made it to the assembly point. Everyone accounted for.');
  }
}

// ================= HUD scene =================
class Hud extends Phaser.Scene{
  constructor(){ super('hud'); }
  create(){
    this.L=this.scene.get('lab');
    tex(this,'officer',24,24,(c)=>{ R(c,'#F4D9A8',0,0,24,24);
      O(c,'#F2C49B',6,6,12,13); R(c,'#2B1E16',4,4,16,5); R(c,'#F2C200',5,5,14,3); R(c,'#FFE57A',7,5,5,1); R(c,'#F2C200',3,8,18,2);
      R(c,'#2E3944',7,11,4,3); R(c,'#2E3944',13,11,4,3); R(c,'#BFE6FA',8,12,2,1); R(c,'#BFE6FA',14,12,2,1); R(c,'#2E3944',11,12,2,1);
      R(c,'#B0705A',10,16,4,1); O(c,'#F28C28',3,19,18,5); R(c,'#E8E8E8',5,21,14,1); });
    this.flash=this.add.rectangle(0,0,10,10,0xE2302D,0).setOrigin(0);
    this.gQuest=this.add.graphics(); this.gDlg=this.add.graphics(); this.gMap=this.add.graphics(); this.gArrow=this.add.graphics(); this.gEnd=this.add.graphics();
    const ts=(size,color='#3A2716',weight='600')=>({fontFamily:FONT,fontSize:size+'px',fontStyle:weight,color,resolution:2});
    this.qStep=this.add.text(0,0,'',ts(15,'#7A5E40'));
    this.qTask=this.add.text(0,0,'',ts(18));
    this.qTimer=this.add.text(0,0,'',ts(28,'#C8102E','700'));
    this.qStat=this.add.text(0,0,'',ts(15,'#5B3A1E'));
    this.portrait=this.add.image(0,0,'officer').setScale(3).setOrigin(0);
    this.dName=this.add.text(0,0,'Safety Officer',ts(16,'#7A5E40','700'));
    this.dText=this.add.text(0,0,'',ts(19));
    this.tag=this.add.text(0,0,'',{...ts(15,'#FFFFFF','700'),backgroundColor:'#3A2716',padding:{x:6,y:2}}).setOrigin(.5,1);
    this.ebub=this.add.text(0,0,'E',{...ts(16,'#3A2716','700'),backgroundColor:'#F7E3B5',padding:{x:6,y:1}}).setOrigin(.5,1);
    this.endTitle=this.add.text(0,0,'',ts(34,'#3A2716','700')).setOrigin(.5);
    this.endBody=this.add.text(0,0,'',{...ts(19),align:'center'}).setOrigin(.5);
    this.msg=null; this.typed=0; this.msgAge=0;
    this.scale.on('resize',()=>this.layout()); this.layout();
  }
  frame(g,x,y,w,h){ g.fillStyle(0x3E2410).fillRoundedRect(x,y,w,h,8); g.fillStyle(0xC27A3A).fillRoundedRect(x+3,y+3,w-6,h-6,6);
    g.fillStyle(0x8A5226).fillRoundedRect(x+7,y+7,w-14,h-14,4); g.fillStyle(0xF7E3B5).fillRoundedRect(x+9,y+9,w-18,h-18,3);
    g.fillStyle(0xE6CC94).fillRect(x+9,y+h-13,w-18,4); }
  layout(){
    const W=this.scale.width,H=this.scale.height, narrow=W<640;
    this.qw=narrow?W-24:320; this.qx=W-this.qw-12; this.qy=12;
    this.qTask.setWordWrapWidth(this.qw-36);
    this.dw=Math.min(760,W-24); this.dh=narrow?118:124; this.dx=(W-this.dw)/2; this.dy=H-this.dh-12;
    this.dText.setWordWrapWidth(this.dw-(narrow?40:150));
    this.flash.setSize(W,H);
    this.gMap.clear();
    this.lastKey='';
  }
  drawMapFrame(){ this.gMap.clear(); if(!this.L.mini||!this.L.mini.visible) return;
    const g=this.gMap; g.lineStyle(7,0x3E2410).strokeRoundedRect(12,12,158,214,6); g.lineStyle(3,0xC27A3A).strokeRoundedRect(12,12,158,214,6); }
  update(time,delta){
    const L=this.L; if(!L||!L.s) return;
    const W=this.scale.width,H=this.scale.height, st=L.step, s=L.s;
    this.drawMapFrame();
    // quest box
    const urgent=st&&st.urgent&&!s.done;
    const key=[s.pendingFirst,s.step,s.score,s.ppe,s.carry,s.kit,s.done,urgent,Math.ceil(s.timer||0),W,H].join('|');
    if(key!==this.lastKey){ this.lastKey=key;
      this.qStep.setText(s.done?'Drill complete':`Step ${s.step+1} of ${STEPS.length}${urgent?'  (urgent)':''}`).setColor(urgent?'#C8102E':'#7A5E40');
      this.qTask.setText(s.done?`Score ${s.score}/100`:(s.pendingFirst?'Press E or wait to begin.':st.text));
      this.qStat.setText(`Score ${s.score}   ${s.ppe?'PPE on':'No PPE'}   ${s.carry?'Holding acetone':(s.kit?'Holding spill kit':'Hands free')}`);
      const hasT=s.timer!==null&&!s.done;
      const qh=40+this.qTask.height+(hasT?36:0)+28;
      this.gQuest.clear(); this.frame(this.gQuest,this.qx,this.qy,this.qw,qh);
      if(urgent){ this.gQuest.fillStyle(0xC8102E).fillRect(this.qx+9,this.qy+9,5,qh-22); }
      this.qStep.setPosition(this.qx+20,this.qy+14); this.qTask.setPosition(this.qx+20,this.qy+34);
      this.qTimer.setPosition(this.qx+20,this.qy+38+this.qTask.height).setVisible(hasT);
      this.qStat.setPosition(this.qx+20,this.qy+qh-34);
    }
    if(s.timer!==null&&!s.done) this.qTimer.setText(Math.max(0,s.timer).toFixed(1)+' s');
    // alarm flash
    this.flash.setFillStyle(0xE2302D, st&&st.id==='evac'&&!s.done ? (.07+.07*Math.sin(time/140)) : 0);
    // dialog
    if(L.lastMsg&&L.lastMsg!==this.msg){ this.msg=L.lastMsg; this.typed=0; this.msgAge=0; }
    this.gDlg.clear();
    if(this.msg){ this.msgAge+=delta; const full=this.msg.text;
      this.typed=Math.min(full.length,this.typed+delta*.06);
      const vis=this.msgAge< (full.length/0.06+5000);
      const narrow=W<640;
      if(vis){ this.frame(this.gDlg,this.dx,this.dy,this.dw,this.dh);
        if(this.msg.kind==='bad'||this.msg.kind==='alert'){ this.gDlg.fillStyle(0xC8102E).fillRect(this.dx+9,this.dy+9,this.dw-18,4); }
        if(!narrow){ this.gDlg.fillStyle(0x8A5226).fillRect(this.dx+this.dw-104,this.dy+16,84,84); }
        this.portrait.setVisible(!narrow).setPosition(this.dx+this.dw-98,this.dy+22);
        this.dName.setVisible(true).setPosition(this.dx+22,this.dy+14).setText(this.msg.kind==='bad'?'Safety Officer (not impressed)':this.msg.kind==='good'?'Safety Officer (pleased)':'Safety Officer');
        this.dText.setVisible(true).setPosition(this.dx+22,this.dy+36).setText(full.slice(0,Math.floor(this.typed)));
      } else { this.portrait.setVisible(false); this.dName.setVisible(false); this.dText.setVisible(false); }
    } else { this.portrait.setVisible(false); this.dName.setVisible(false); this.dText.setVisible(false); }
    // world-anchored tags
    const cam=L.cameras.main, z=cam.zoom, toS=(x,y)=>({x:(x-cam.worldView.x)*z,y:(y-cam.worldView.y)*z});
    const o=L.nearest(20);
    if(o&&!s.done){ const sp=toS(o.x+o.w/2,o.y); this.tag.setVisible(true).setText(o.label).setPosition(sp.x,sp.y-4); } else this.tag.setVisible(false);
    if(L.canAct()){ const sp=toS(L.player.x,L.player.y-16); this.ebub.setVisible(true).setPosition(sp.x,sp.y-2+Math.sin(time/150)*2); } else this.ebub.setVisible(false);
    // off-screen target arrow
    this.gArrow.clear(); const t=L.targetPoint();
    if(t){ const sp=toS(t.x,t.y), m=30;
      if(sp.x<0||sp.y<0||sp.x>W||sp.y>H){ const cx=W/2,cy=H/2, a=Math.atan2(sp.y-cy,sp.x-cx);
        const k=Math.min((W/2-m)/Math.abs(Math.cos(a)||1e-6),(H/2-m)/Math.abs(Math.sin(a)||1e-6)); const ax=cx+Math.cos(a)*k, ay=cy+Math.sin(a)*k;
        const pt=(r,da)=>({x:ax+Math.cos(a+da)*r,y:ay+Math.sin(a+da)*r});
        const p1=pt(18,0),p2=pt(12,2.4),p3=pt(12,-2.4);
        this.gArrow.fillStyle(0x2B1E16).fillTriangle(p1.x,p1.y,p2.x,p2.y,p3.x,p3.y);
        const q1=pt(14,0),q2=pt(9,2.4),q3=pt(9,-2.4);
        this.gArrow.fillStyle(urgent?0xE2302D:0xF2C200).fillTriangle(q1.x,q1.y,q2.x,q2.y,q3.x,q3.y); } }
    // end panel
    this.gEnd.clear();
    if(L.result){ const pw=Math.min(460,W-40),ph=210,px=(W-pw)/2,py=(H-ph)/2-40; this.frame(this.gEnd,px,py,pw,ph);
      const r=L.result, stars=r.score>=90?'★★★':r.score>=70?'★★☆':'★☆☆';
      this.endTitle.setVisible(true).setPosition(W/2,py+52).setText(r.v.length?'Drill complete':'Perfect drill!');
      this.endBody.setVisible(true).setPosition(W/2,py+130).setText(`${stars}\nScore ${r.score}/100 in ${r.secs} s\n${r.v.length} violation${r.v.length===1?'':'s'}. Details in the event log.`);
    } else { this.endTitle.setVisible(false); this.endBody.setVisible(false); }
  }
}

function boot(){
  const game=new Phaser.Game({ type:Phaser.AUTO, parent:'game', backgroundColor:'#3d6b2a', pixelArt:true,
    physics:{default:'arcade',arcade:{debug:false}}, scale:{mode:Phaser.Scale.RESIZE,width:'100%',height:'100%'}, scene:[Lab,Hud] });
  const L=()=>game.scene.getScene('lab');
  $('btnAct').onclick=()=>L().act(); $('btnDesc').onclick=()=>L().describe(); $('btnMap').onclick=()=>L().toggleMap();
  $('btnRestart').onclick=()=>{ if('speechSynthesis' in window) speechSynthesis.cancel(); L().scene.restart(); $('game').focus(); };
  $('game').focus();
}
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(boot);
</script>
